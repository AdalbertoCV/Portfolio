<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="bg" cx="30%" cy="18%" r="95%">
      <stop offset="0" stop-color="#161a33"/>
      <stop offset="0.6" stop-color="#0a0b18"/>
      <stop offset="1" stop-color="#05060d"/>
    </radialGradient>
    <linearGradient id="peak" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#f1effa"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#a3e635" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#a3e635" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- C: an orbit that stops short, open on the right -->
  <path d="M45.8 17.6 A20 20 0 1 0 45.8 46.4" fill="none" stroke="url(#arc)" stroke-width="4" stroke-linecap="round"/>
  <!-- A: a solid peak with a notch for a counter, standing inside the orbit -->
  <path d="M19 46 L32 17 L45 46 Z M27.4 46 L32 35.5 L36.6 46 Z" fill="url(#peak)" fill-rule="evenodd"/>
  <!-- the satellite at the end of the orbit -->
  <circle cx="45.8" cy="46.4" r="6" fill="url(#glow)"/>
  <circle cx="45.8" cy="46.4" r="2.6" fill="#d9f99d"/>
</svg>
