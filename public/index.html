<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0a0a0a" />

    <!--
      Loaded here rather than through an @import in index.css: an import is only
      discovered after the CSS bundle has downloaded and parsed, which puts the
      fonts a full round trip behind. preconnect opens the connections early.
      Only the weights the site actually sets are requested.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Cinzel:wght@600&display=swap"
    />
    <!--
      This is the only metadata a link unfurler ever sees. The app is a
      client-rendered SPA, so LinkedIn, Slack, WhatsApp and X read this file and
      nothing else — whatever <RouteMeta> sets per route afterwards exists for
      the browser tab, the history entry, and crawlers that do run JavaScript.
      So the strongest, most specific version of the pitch belongs right here.
    -->
    <meta
      name="description"
      content="Founding Software Engineer at Radii Manufacturing, building the backend, cloud and AI systems behind an AI manufacturing platform. Founder of Moonphase and StackSelect."
    />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Adal Cerrillo" />
    <meta property="og:url" content="https://portfolio-phi-ten-37.vercel.app/" />
    <meta property="og:title" content="Adal Cerrillo — Founding Software Engineer" />
    <meta
      property="og:description"
      content="Founding Software Engineer at Radii Manufacturing, building the backend, cloud and AI systems behind an AI manufacturing platform. Founder of Moonphase and StackSelect."

      property="og:image:alt"
      content="Adal Cerrillo — Founding Software Engineer at Radii Manufacturing"
    />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="es_MX" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Adal Cerrillo — Founding Software Engineer" />

      name="twitter:description"
      content="Founding Software Engineer at Radii Manufacturing, building the backend, cloud and AI systems behind an AI manufacturing platform. Founder of Moonphase and StackSelect."

    -->

    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <!-- Replaced per route by <RouteMeta>; this is what a crawler that does not
         run JavaScript indexes, so it names the role rather than the file. -->
    <title>Adal Cerrillo — Founding Software Engineer</title>
    <script>
      // Sets the theme before first paint. Without this a light-preferring
      // visitor gets a dark flash on every load, because the bundle that
      // knows their preference has not run yet.
      // The two reads are guarded separately so this resolves identically to
      // resolveTheme(): a storage failure still consults the media query, and
      // only a media-query failure falls back to light.
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem('portfolio-theme');
        } catch (error) {
          // Blocked storage: fall through to the media query.
        }

        var theme = stored === 'light' || stored === 'dark' ? stored : null;

        if (theme === null) {
          var prefersDark = false;
          try {
            prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          } catch (error) {
            // No matchMedia: resolveTheme treats this as light.
          }
          theme = prefersDark ? 'dark' : 'light';
        }

        document.documentElement.setAttribute('data-theme', theme);
      })();

      // Sets lang before first paint, mirroring detectLanguage() in
      // src/i18n/i18n.js: a stored 'en'/'es' choice wins; otherwise any
      // navigator.languages entry starting with "es" (case-insensitive)
      // selects Spanish; otherwise English. Without this a Spanish visitor's
      // first paint claims English until React hydrates and corrects it.
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem('portfolio-lang');
        } catch (error) {
          // Blocked storage: fall through to navigator.languages.
        }

        var lang = stored === 'en' || stored === 'es' ? stored : null;

        if (lang === null) {
          var tags = Array.isArray(navigator.languages) ? navigator.languages : [];
          var wantsSpanish = tags.some(function (tag) {
            return typeof tag === 'string' && tag.toLowerCase().indexOf('es') === 0;
          });
          lang = wantsSpanish ? 'es' : 'en';
        }

        document.documentElement.setAttribute('lang', lang);
      })();
    </script>
